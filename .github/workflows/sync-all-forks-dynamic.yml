name: Dynamic Sync All Forks
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

env:
  MY_TOKEN: ${{ secrets.MY_TOKEN }}
  USER: weichuang88

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch all forks and sync
        run: |
          set -e
          # 获取当前用户所有仓库
          json=$(curl -s -H "Authorization: token $MY_TOKEN" "https://api.github.com/users/${USER}/repos?per_page=100")
          # 判断返回是不是JSON数组
          if ! echo "$json" | jq -e 'type == "array"' >/dev/null; then
            echo "❌ API返回不是JSON，token错误/限流！"
            echo "$json"
            exit 1
          fi
          # 筛选所有fork仓库，输出：仓库全名 上游仓库全名 默认分支
          echo "$json" | jq -r '.[] | select(.fork==true) | [.full_name, .parent.full_name, .default_branch] | @tsv' | while IFS=$'\t' read -r repo_full upstream_full branch; do
            echo "===== 正在同步：$repo_full  上游：$upstream_full 分支：$branch ====="
            if [ "$upstream_full" = "null" ]; then
              echo "跳过，无上游仓库"
              continue
            fi
            # 克隆fork仓库
            git clone --depth 1 "https://${USER}:${MY_TOKEN}@github.com/${repo_full}.git" repo_sync
            cd repo_sync
            # 添加上游源
            git remote add upstream "https://github.com/${upstream_full}.git" || true
            git fetch upstream
            git checkout "$branch"
            # 合并上游，冲突不阻断，只打日志
            git merge "upstream/$branch" || {
              echo "⚠️ 合并冲突，跳过本次推送 $repo_full"
              cd ..
              rm -rf repo_sync
              continue
            }
            git push origin "$branch"
            cd ..
            rm -rf repo_sync
            echo "✅ $repo_full 同步完成"
          done
          echo "🎉 全部fork扫描执行完毕"
