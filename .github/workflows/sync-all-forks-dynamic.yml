name: Dynamic Sync All Forks
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

env:
  MY_TOKEN: ${{ secrets.MY_TOKEN }}
  USER: weichuang88

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch all forks and sync
        run: |
          set -e
          # 获取所有仓库
          json=$(curl -s -H "Authorization: token $MY_TOKEN" "https://api.github.com/users/${USER}/repos?per_page=100")

          if ! echo "$json" | jq -e 'type == "array"' >/dev/null; then
            echo "❌ API返回不是JSON，token错误/限流！"
            echo "$json"
            exit 1
          fi

          # 输出json数组，安全遍历
          echo "$json" | jq -c '.[] | select(.fork==true) | {full_name, parent: (.parent // {}), default_branch}' | while read -r item; do
            repo_full=$(echo "$item" | jq -r '.full_name')
            upstream_full=$(echo "$item" | jq -r '.parent.full_name // ""')
            branch=$(echo "$item" | jq -r '.default_branch')

            echo "===== 正在同步：$repo_full  上游：$upstream_full 分支：$branch ====="

            # 上游为空直接跳过
            if [ -z "$upstream_full" ] || [ "$upstream_full" = "null" ]; then
              echo "⚠️ 该fork没有上游源，跳过"
              continue
            fi

            git clone --depth 1 "https://${USER}:${MY_TOKEN}@github.com/${repo_full}.git" repo_sync
            cd repo_sync
            git remote add upstream "https://github.com/${upstream_full}.git" || true
            git fetch upstream
            git checkout "$branch"

            # 合并失败就跳过，不中断
            if git merge "upstream/$branch"; then
              git push origin "$branch"
              echo "✅ $repo_full 同步成功"
            else
              echo "⚠️ 合并冲突，跳过推送 $repo_full"
            fi

            cd ..
            rm -rf repo_sync
          done
          echo "🎉 全部fork扫描结束"
