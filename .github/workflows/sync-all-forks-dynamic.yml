name: Dynamic Sync All Forks
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

env:
  MY_TOKEN: ${{ secrets.MY_TOKEN }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch all forks and sync
        run: |
          set -e
          json=$(curl -s -H "Authorization: token $GH_TOKEN" https://api.github.com/user/repos)
          # 判断返回是不是JSON数组
          if ! echo "$json" | jq -e 'type == "array"' >/dev/null; then
            echo "❌ API返回不是JSON，token错误/限流！"
            echo "$json"
            exit 1
          fi
          echo "$json" | jq -r '.[] | select(.fork==true) | .name,.full_name,.parent.full_name,.default_branch' | while read -r repo_name; do
            read -r repo_full
            read -r upstream_full
            read -r def_branch

            if [[ "$upstream_full" == "null" ]]; then
              echo "==== Skip $repo_full : upstream parent is null ===="
              continue
            fi

            echo "==== Sync $repo_full | upstream: $upstream_full | branch: $def_branch ===="
            git clone "https://${GH_TOKEN}@github.com/${repo_full}.git"
            cd "$repo_name"
            git remote add upstream "https://github.com/${upstream_full}.git"
            git fetch upstream
            git checkout "$def_branch"
            git reset --hard upstream/"$def_branch"
            git push origin "$def_branch" --force
            cd ..
            rm -rf "$repo_name"
          done
